    <!-- Elbow to wrist -->
    <path d="M 172 325 C 168 338, 166 353, 168 366"/>

    <!-- Palm / wrist base -->
    <path d="M 168 366 C 163 354, 160 342, 160 330"/>

    <!-- FINGERS — five lines fanning upward from palm -->
    <!-- Pinky (leftmost) -->
    <path d="M 154 332 C 148 315, 145 298, 147 284"/>
    <!-- Ring -->
    <path d="M 161 326 C 155 308, 154 290, 156 276"/>
    <!-- Middle (tallest) -->
    <path d="M 168 321 C 164 302, 163 284, 165 270"/>
    <!-- Index -->
    <path d="M 175 320 C 174 302, 175 285, 179 271"/>
    <!-- Thumb (rightmost, shorter) -->
    <path d="M 183 323 C 185 309, 190 296, 198 284"/>

  </g>
</svg>
